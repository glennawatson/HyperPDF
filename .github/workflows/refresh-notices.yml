name: Refresh third-party notices
on:
  pull_request:
    branches: [main]
    paths:
      - Directory.Packages.props
      - licenses/components.json
      - licenses/packages.json
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-notices-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  refresh:
    name: Refresh notices
    if: github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@315788024be8e61daa4f2b957e6476746211b522 # main
        with:
          src-folder: '.'
          stamp-version: 'false'
          dotnet-versions: |
            11.x
            10.x
      - name: Rebuild the notices from the restored packages and push any change
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/RefreshThirdPartyNotices.cs -- --push
