name: Refresh third-party notices
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: refresh-notices-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    name: Refresh notices
    environment: notices_generate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Create notices push token
        id: notices-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.NOTICES_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOTICES_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.notices-token.outputs.token }}
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@e793ab9257b1b034ed5cb9695609338317ea1221 # main
        with:
          src-folder: '.'
          stamp-version: 'false'
          dotnet-versions: |
            11.x
            10.x
      - name: Rebuild the notices from the restored packages and push any change
        run: dotnet run --file src/tools/RefreshThirdPartyNotices.cs -- --push
