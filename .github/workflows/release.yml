name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag.'
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). Empty = stable release.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Compute version and tag
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'

  # Native AOT cannot cross-compile, so each operating system publishes its own build.
  publish-windows:
    name: Publish ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
        - rid: win-arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Publish Native AOT
      run: dotnet run --file scripts/Publish.cs -- "${{ matrix.rid }}" "-p:Version=${{ needs.version.outputs.version }}" "-p:MinVerVersionOverride=${{ needs.version.outputs.version }}"
    - name: Upload the published app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: app-${{ matrix.rid }}
        path: artifacts/${{ matrix.rid }}
        if-no-files-found: error

  # Publishing and packaging share a job so the Unix file modes survive; artifacts drop them.
  package-linux:
    name: Package ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          deb-architecture: amd64
          rpm-architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          deb-architecture: arm64
          rpm-architecture: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Publish Native AOT
      run: dotnet run --file scripts/Publish.cs -- "${{ matrix.rid }}" "-p:Version=${{ needs.version.outputs.version }}" "-p:MinVerVersionOverride=${{ needs.version.outputs.version }}"
    - name: Stage the installed tree
      run: |
        mkdir -p artifacts/stage/usr/lib artifacts/stage/usr/bin artifacts/stage/usr/share/licenses/hyperpdf
        cp -R "artifacts/$RID" artifacts/stage/usr/lib/hyperpdf
        ln -s /usr/lib/hyperpdf/hyperpdf artifacts/stage/usr/bin/hyperpdf
        cp LICENSE artifacts/stage/usr/share/licenses/hyperpdf/LICENSE
    - name: Stage the desktop integration
      run: |
        mkdir -p artifacts/stage/usr/share/applications artifacts/stage/usr/share/metainfo artifacts/stage/usr/share/icons
        cp packaging/linux/net.glennwatson.HyperPDF.desktop artifacts/stage/usr/share/applications/
        cp packaging/linux/net.glennwatson.HyperPDF.metainfo.xml artifacts/stage/usr/share/metainfo/
        cp -R packaging/linux/icons/hicolor artifacts/stage/usr/share/icons/hicolor
    - name: Stage the AppDir
      run: |
        mkdir -p artifacts/appdir/usr/share/applications artifacts/appdir/usr/share/metainfo artifacts/appdir/usr/share/icons
        cp -R "artifacts/$RID" artifacts/appdir/usr/bin
        ln -s usr/bin/hyperpdf artifacts/appdir/AppRun
        cp -R packaging/linux/icons/hicolor artifacts/appdir/usr/share/icons/hicolor
    - name: Stage the AppDir desktop entry and icon
      run: |
        cp packaging/linux/net.glennwatson.HyperPDF.desktop artifacts/appdir/
        cp packaging/linux/net.glennwatson.HyperPDF.desktop artifacts/appdir/usr/share/applications/
        cp packaging/linux/icons/hicolor/256x256/apps/net.glennwatson.HyperPDF.png artifacts/appdir/
        ln -s net.glennwatson.HyperPDF.png artifacts/appdir/.DirIcon
    - name: Stage the AppDir metadata
      run: cp packaging/linux/net.glennwatson.HyperPDF.metainfo.xml artifacts/appdir/usr/share/metainfo/net.glennwatson.HyperPDF.appdata.xml
    - name: Build the RPM
      uses: glennawatson/actions-common/.github/actions/rpm-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/stage
        output: artifacts/hyperpdf-${{ needs.version.outputs.version }}-1.${{ matrix.rpm-architecture }}.rpm
        name: hyperpdf
        version: ${{ needs.version.outputs.version }}
        architecture: ${{ matrix.rpm-architecture }}
        summary: Fast, tabbed PDF viewer
        description: |
          Renders with HyperPDF, follows the KDE colour scheme and opens documents launched
          from the file manager as tabs in the running window.
        license: MIT
        url: https://github.com/glennawatson/HyperPDF
        vendor: Glenn Watson
        requires: |
          fontconfig
          libX11
          libICE
          libSM
        recommends: |
          libwayland-client
          libxkbcommon
          mesa-libEGL
          cups-libs
          pulseaudio-libs
        owned-directories: |
          /usr/lib/hyperpdf
          /usr/share/licenses/hyperpdf
    - name: Build the DEB
      uses: glennawatson/actions-common/.github/actions/deb-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/stage
        output: artifacts/hyperpdf_${{ needs.version.outputs.version }}_${{ matrix.deb-architecture }}.deb
        name: hyperpdf
        version: ${{ needs.version.outputs.version }}
        architecture: ${{ matrix.deb-architecture }}
        maintainer: Glenn Watson
        summary: Fast, tabbed PDF viewer
        description: |
          Renders with HyperPDF, follows the KDE colour scheme and opens documents launched
          from the file manager as tabs in the running window.
        homepage: https://github.com/glennawatson/HyperPDF
        section: graphics
        depends: |
          libfontconfig1 | fontconfig
          libx11-6 | libX11
          libice6 | libICE
          libsm6 | libSM
        recommends: |
          libwayland-client0
          libxkbcommon0
          libegl1
          libcups2
          libpulse0
    - name: Build the AppImage
      uses: glennawatson/actions-common/.github/actions/appimage-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        appdir: artifacts/appdir
        architecture: ${{ matrix.rpm-architecture }}
        output: artifacts/HyperPDF-${{ needs.version.outputs.version }}-${{ matrix.rpm-architecture }}.AppImage
    - name: Build the tar.gz
      run: tar -czf "artifacts/hyperpdf-$VERSION-$RID.tar.gz" -C artifacts "$RID"
    - name: Upload the Linux packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: packages-${{ matrix.rid }}
        path: |
          artifacts/HyperPDF-*.AppImage
          artifacts/hyperpdf_*.deb
          artifacts/hyperpdf-*.rpm
          artifacts/hyperpdf-*.tar.gz
        if-no-files-found: error

  # Publishing and packaging share a job so the Unix file modes survive; artifacts drop them.
  package-macos:
    name: Package ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
      APP: artifacts/macos-${{ matrix.rid }}.noindex/Hyper PDF Viewer.app
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Publish Native AOT
      run: dotnet run --file scripts/Publish.cs -- "${{ matrix.rid }}" "-p:Version=${{ needs.version.outputs.version }}" "-p:MinVerVersionOverride=${{ needs.version.outputs.version }}"
    # The .noindex folder stops Spotlight holding files open while the image is built.
    - name: Lay out the app bundle
      uses: glennawatson/actions-common/.github/actions/macos-app-bundle@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/${{ matrix.rid }}
        output: artifacts/macos-${{ matrix.rid }}.noindex/Hyper PDF Viewer.app
        name: Hyper PDF Viewer
        bundle-identifier: net.glennwatson.HyperPDF
        version: ${{ needs.version.outputs.version }}
        executable: hyperpdf
        icon: packaging/macos/HyperPdf.icns
        minimum-system-version: '12.0'
        document-types: 'com.adobe.pdf: Viewer: PDF Document'
        category: public.app-category.productivity
        copyright: Copyright (c) 2026 Glenn Watson. MIT licensed.
    # Contents/MacOS holds only code to sign; the app also looks for its text recognition data in Contents/Resources.
    - name: Move the text recognition data to Resources
      run: mv "$APP/Contents/MacOS/tessdata" "$APP/Contents/Resources/tessdata"
    - name: Sign the app bundle (ad hoc)
      run: codesign --force --deep --sign - "$APP"
    - name: Build the DMG
      uses: glennawatson/actions-common/.github/actions/dmg-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/macos-${{ matrix.rid }}.noindex
        volume-name: Hyper PDF Viewer
        output: artifacts/hyperpdf-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg
    - name: Build the app zip
      run: tar -a -cf "artifacts/hyperpdf-$VERSION-$RID.app.zip" -C "artifacts/macos-$RID.noindex" "Hyper PDF Viewer.app"
    - name: Upload the macOS packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: packages-${{ matrix.rid }}
        path: |
          artifacts/hyperpdf-*.dmg
          artifacts/hyperpdf-*.app.zip
        if-no-files-found: error

  pack-nuget:
    name: Pack the NuGet libraries
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Pack HyperPdfLibrary
      run: dotnet pack src/HyperPdfLibrary/HyperPdfLibrary.csproj -c Release -o artifacts/nuget "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Pack HyperPdfLibrary.Render.Skia
      run: dotnet pack src/HyperPdfLibrary.Render.Skia/HyperPdfLibrary.Render.Skia.csproj -c Release -o artifacts/nuget "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Upload the packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nuget-unsigned
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error

  # One Linux job signs in to the token once and signs everything. The Windows installers are built here so they
  # hold the signed executables.
  sign:
    name: Sign everything
    needs: [version, publish-windows, package-linux, package-macos, pack-nuget]
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Download the x64 Windows app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: app-win-x64
        path: artifacts/win-x64
    - name: Download the ARM64 Windows app
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: app-win-arm64
        path: artifacts/win-arm64
    - name: Download the Linux and macOS packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: packages-*
        merge-multiple: true
        path: release
    - name: Download the unsigned NuGet packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: nuget-unsigned
        path: release
    # certum-sign matches wildcards in file names only, so both executables share one folder while they are signed.
    - name: Gather the executables
      run: |
        mkdir -p artifacts/exe
        mv artifacts/win-x64/hyperpdf.exe artifacts/exe/hyperpdf-win-x64.exe
        mv artifacts/win-arm64/hyperpdf.exe artifacts/exe/hyperpdf-win-arm64.exe
    - name: Sign the executables, RPMs and NuGet packages
      uses: glennawatson/actions-common/.github/actions/certum-sign@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        authenticode: 'artifacts/exe/*.exe'
        rpm: 'release/*.rpm'
        nuget: 'release/*.nupkg'
    - name: Return the executables
      run: |
        mv artifacts/exe/hyperpdf-win-x64.exe artifacts/win-x64/hyperpdf.exe
        mv artifacts/exe/hyperpdf-win-arm64.exe artifacts/win-arm64/hyperpdf.exe
    - name: Stage the MSIX payloads
      run: |
        cp -R artifacts/win-x64 artifacts/msix-win-x64
        cp -R artifacts/win-arm64 artifacts/msix-win-arm64
        cp LICENSE artifacts/msix-win-x64/LICENSE
        cp LICENSE artifacts/msix-win-arm64/LICENSE
    - name: Add the MSIX logos
      run: |
        mkdir -p artifacts/msix-win-x64/Assets
        cp packaging/linux/icons/hicolor/48x48/apps/net.glennwatson.HyperPDF.png artifacts/msix-win-x64/Assets/Square44x44Logo.png
        cp packaging/linux/icons/hicolor/256x256/apps/net.glennwatson.HyperPDF.png artifacts/msix-win-x64/Assets/Square150x150Logo.png
        cp packaging/linux/icons/hicolor/48x48/apps/net.glennwatson.HyperPDF.png artifacts/msix-win-x64/Assets/StoreLogo.png
    - name: Add the ARM64 MSIX logos
      run: cp -R artifacts/msix-win-x64/Assets artifacts/msix-win-arm64/Assets
    - name: Build the x64 MSIX
      uses: glennawatson/actions-common/.github/actions/msix-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/msix-win-x64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-x64.msix
        identity-name: net.glennwatson.HyperPDF
        publisher: 'CN=Glenn Andrew Watson, O=Glenn Andrew Watson, L=Mooroolbark, S=Victoria, C=AU'
        version: ${{ needs.version.outputs.version }}
        architecture: x64
        display-name: Hyper PDF Viewer
        publisher-display-name: Glenn Watson
        description: A calm PDF viewer
        executable: hyperpdf.exe
        application-id: HyperPDF
        square44-logo: Assets/Square44x44Logo.png
        square150-logo: Assets/Square150x150Logo.png
        store-logo: Assets/StoreLogo.png
        min-version: 10.0.19041.0
        file-types: .pdf
        file-type-name: PDF document
    - name: Build the ARM64 MSIX
      uses: glennawatson/actions-common/.github/actions/msix-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/msix-win-arm64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-arm64.msix
        identity-name: net.glennwatson.HyperPDF
        publisher: 'CN=Glenn Andrew Watson, O=Glenn Andrew Watson, L=Mooroolbark, S=Victoria, C=AU'
        version: ${{ needs.version.outputs.version }}
        architecture: arm64
        display-name: Hyper PDF Viewer
        publisher-display-name: Glenn Watson
        description: A calm PDF viewer
        executable: hyperpdf.exe
        application-id: HyperPDF
        square44-logo: Assets/Square44x44Logo.png
        square150-logo: Assets/Square150x150Logo.png
        store-logo: Assets/StoreLogo.png
        min-version: 10.0.19041.0
        file-types: .pdf
        file-type-name: PDF document
    - name: Build the x64 MSI
      uses: glennawatson/actions-common/.github/actions/msi-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/win-x64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-x64.msi
        product-name: Hyper PDF Viewer
        manufacturer: Glenn Watson
        version: ${{ needs.version.outputs.version }}
        upgrade-code: '{0C547842-7023-455E-9807-E4C0CA332DA8}'
        architecture: x64
        install-folder: 'Glenn Watson\Hyper PDF Viewer'
        executable: hyperpdf.exe
        icon: packaging/windows/HyperPdf.ico
        homepage: https://github.com/glennawatson/HyperPDF
    - name: Build the ARM64 MSI
      uses: glennawatson/actions-common/.github/actions/msi-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/win-arm64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-arm64.msi
        product-name: Hyper PDF Viewer
        manufacturer: Glenn Watson
        version: ${{ needs.version.outputs.version }}
        upgrade-code: '{0C547842-7023-455E-9807-E4C0CA332DA8}'
        architecture: arm64
        install-folder: 'Glenn Watson\Hyper PDF Viewer'
        executable: hyperpdf.exe
        icon: packaging/windows/HyperPdf.ico
        homepage: https://github.com/glennawatson/HyperPDF
    - name: Zip the x64 app
      uses: glennawatson/actions-common/.github/actions/zip-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/win-x64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-x64.zip
    - name: Zip the ARM64 app
      uses: glennawatson/actions-common/.github/actions/zip-build@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        source: artifacts/win-arm64
        output: release/hyperpdf-${{ needs.version.outputs.version }}-win-arm64.zip
    - name: Checkout the AUR generator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: glennawatson/actions-common
        ref: 315788024be8e61daa4f2b957e6476746211b522 # main
        path: .actions-common
        persist-credentials: false
    - name: Write the AUR PKGBUILD and .SRCINFO
      shell: sh
      env:
        AUR_DEBS: release
        AUR_NAME: hyperpdf-bin
        AUR_VERSION: ${{ needs.version.outputs.version }}
        AUR_DESCRIPTION: Fast, tabbed PDF viewer
        AUR_URL: https://github.com/glennawatson/HyperPDF
        AUR_LICENSE: MIT
        AUR_DEPENDS: |
          fontconfig
          libx11
          libice
          libsm
          gcc-libs
          glibc
        AUR_OPTDEPENDS: |
          wayland: native Wayland support
          libxkbcommon: Wayland keyboard input
          libegl: native Wayland rendering
          libcups: print straight to a printer
          libpulse: Read Aloud sound through PulseAudio or PipeWire
        AUR_OPTIONS: |
          !strip
          !debug
        AUR_MAINTAINER: Glenn Watson
        AUR_SOURCE_URL: https://github.com/glennawatson/HyperPDF/releases/download/${{ needs.version.outputs.tag }}/{file}
        AUR_OUTPUT: release
      run: dotnet run --file .actions-common/.github/actions/aur-build/aur-build.cs
    - name: Sign the installers and the checksums
      uses: glennawatson/actions-common/.github/actions/certum-sign@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        authenticode: 'release/*.msi*'
        checksums: 'release/*'
    - name: Upload the release files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: release
        include-hidden-files: true
        if-no-files-found: error
    - name: Upload the signed NuGet packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nuget-signed
        path: release/*.nupkg
        if-no-files-found: error

  verify-linux:
    name: Verify ${{ matrix.rid }} DEB and AppImage
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          deb-architecture: amd64
          architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          deb-architecture: arm64
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the DEB
      uses: glennawatson/actions-common/.github/actions/deb-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        package: packages/hyperpdf_${{ needs.version.outputs.version }}_${{ matrix.deb-architecture }}.deb
        name: hyperpdf
        expect-files: |
          /usr/bin/hyperpdf
          /usr/lib/hyperpdf/hyperpdf
          /usr/share/applications/net.glennwatson.HyperPDF.desktop
          /usr/share/metainfo/net.glennwatson.HyperPDF.metainfo.xml
    - name: Verify the AppImage
      uses: glennawatson/actions-common/.github/actions/appimage-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        package: packages/HyperPDF-${{ needs.version.outputs.version }}-${{ matrix.architecture }}.AppImage

  verify-rpm:
    name: Verify ${{ matrix.rid }} RPM
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: linux-x64
          runner: ubuntu-latest
          architecture: x86_64
        - rid: linux-arm64
          runner: ubuntu-24.04-arm
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the RPM
      uses: glennawatson/actions-common/.github/actions/rpm-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        package: packages/hyperpdf-${{ needs.version.outputs.version }}-1.${{ matrix.architecture }}.rpm
        name: hyperpdf
        expect-files: |
          /usr/bin/hyperpdf
          /usr/lib/hyperpdf/hyperpdf
          /usr/share/applications/net.glennwatson.HyperPDF.desktop
          /usr/share/metainfo/net.glennwatson.HyperPDF.metainfo.xml

  verify-windows:
    name: Verify ${{ matrix.rid }} MSI and MSIX
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: win-x64
          runner: windows-latest
        - rid: win-arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the MSI
      uses: glennawatson/actions-common/.github/actions/msi-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        # msiexec reads a forward slash as an invalid path character (error 1324), so this path uses a backslash.
        package: packages\hyperpdf-${{ needs.version.outputs.version }}-${{ matrix.rid }}.msi
        expect-files: |
          %ProgramFiles%\Glenn Watson\Hyper PDF Viewer\hyperpdf.exe
    - name: Verify the MSIX
      uses: glennawatson/actions-common/.github/actions/msix-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        package: packages/hyperpdf-${{ needs.version.outputs.version }}-${{ matrix.rid }}.msix
        identity-name: net.glennwatson.HyperPDF
        executable: hyperpdf.exe

  verify-macos:
    name: Verify ${{ matrix.rid }} DMG
    needs: [version, sign]
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    steps:
    - name: Download the release files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: Verify the DMG
      uses: glennawatson/actions-common/.github/actions/dmg-verify@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        package: packages/hyperpdf-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg
        app: Hyper PDF Viewer.app
        signed: 'true'

  publish-nuget:
    name: Publish to NuGet
    needs: [version, verify-linux, verify-rpm, verify-windows, verify-macos]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Download signed packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: nuget-signed
        path: signed
    - name: NuGet login (OIDC trusted publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "signed/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  release:
    name: Create release (${{ needs.version.outputs.version }})
    needs: [version, verify-linux, verify-rpm, verify-windows, verify-macos, publish-nuget]
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@4d538f76071ed73496cbf406cebe85e760fb734d # main
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      artifactName: release-assets
      assetGlob: '*'
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
