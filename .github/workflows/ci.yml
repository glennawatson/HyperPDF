name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@4d538f76071ed73496cbf406cebe85e760fb734d # main
    with:
      srcFolder: 'src'
      solutionFile: HyperPdf.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      testTimeout: '45m'
      dotnetVersions: |
        11.x
        10.x
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
        with:
          src-folder: 'src'
          stamp-version: 'false'
          dotnet-versions: |
            11.x
            10.x
      - name: Test on net10.0 and net11.0
        working-directory: src
        run: dotnet test --solution HyperPdf.slnx -c Release -v q --nologo -- --timeout 45m --diagnostic --diagnostic-verbosity Trace --diagnostic-output-directory "${{ runner.temp }}/test-diagnostics"
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-diagnostics-${{ matrix.name }}
          path: ${{ runner.temp }}/test-diagnostics
          if-no-files-found: ignore
      - name: Upload failed renderings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-failures-${{ matrix.name }}
          path: src/tests/**/render-failures
          if-no-files-found: ignore
  pdfa-validation:
    name: PDF/A output validation (veraPDF)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
        with:
          src-folder: 'src'
          stamp-version: 'false'
          dotnet-versions: '11.x'
      - name: Setup Java for veraPDF
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install verified veraPDF
        id: verapdf
        run: dotnet run --file src/tools/InstallVeraPdf.cs -- "${{ runner.temp }}/verapdf"
      - name: Fetch the PDF/A sample files
        run: dotnet run --file src/tools/FetchReferencePdfs.cs -- src/tests/reference-pdfs/manifest.json "${{ runner.temp }}/pdfa-samples" verapdf-pdfa1a-unicode-cmap verapdf-pdfa1b-info-title verapdf-pdfa1b-linearize-settle verapdf-pdfa1b-deep-references verapdf-pdfa1b-utf32le-xmp verapdf-pdfa1b-utf32be-bom-xmp verapdf-pdfa2a-language verapdf-pdfa2b-signed verapdf-pdfa2b-extension-schemas verapdf-pdfa2u-tounicode verapdf-pdfa3b-embedded-file verapdf-pdfa4-signed verapdf-pdfa4-pieceinfo verapdf-pdfa4e-embedded-file verapdf-pdfa4f-embedded-file
      - name: Check out veraPDF's PDF/A test files
        id: testfiles
        run: dotnet run --file src/tools/FetchVeraPdfTestFiles.cs -- "${{ runner.temp }}/verapdf-test-files"
      - name: Check out veraPDF's validation profiles
        id: profiles
        run: dotnet run --file src/tools/FetchVeraPdfProfiles.cs -- "${{ runner.temp }}/verapdf-profiles"
      - name: Validate PDF/A output with veraPDF
        env:
          HYPERPDF_VERAPDF: ${{ steps.verapdf.outputs.verapdf-home }}
          HYPERPDF_REQUIRE_VERAPDF: '1'
          HYPERPDF_PDFA_SAMPLES: ${{ runner.temp }}/pdfa-samples
          HYPERPDF_VERAPDF_TEST_FILES: ${{ steps.testfiles.outputs.test-files-dir }}
          HYPERPDF_VERAPDF_PROFILES: ${{ steps.profiles.outputs.profiles-dir }}
          HYPERPDF_PDFA_OUTPUT: ${{ runner.temp }}/pdfa-output
        run: dotnet run --project "${{ github.workspace }}/src/tests/HyperPdfLibrary.Tests/HyperPdfLibrary.Tests.csproj" -c Release -f net11.0 -- --treenode-filter '/*/HyperPdfLibrary.Tests.Conformance.VeraPdf/*/*' --report-trx --results-directory "${{ runner.temp }}/pdfa-output"
      - name: Upload PDF/A outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdfa-validation
          path: ${{ runner.temp }}/pdfa-output
          if-no-files-found: warn
  pdf20-syntax:
    name: PDF 2.0 copy syntax check (qpdf)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
        with:
          src-folder: 'src'
          stamp-version: 'false'
          dotnet-versions: '11.x'
      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Fetch verified reference PDFs
        run: dotnet run --file src/tools/FetchReferencePdfs.cs -- src/tests/reference-pdfs/manifest.json "${{ runner.temp }}/reference-pdfs" usgs-lost-city-2023 verapdf-ua-headings verapdf-ua-tables verapdf-ua-notes pdfjs-textfields pdfjs-js-buttons pdfjs-annotation-attachment pypdf-latex-forms pypdf-libreoffice-form pypdf-outline pypdf-arabic pypdf-arabic-oneline-cmap pypdf-arabic-rotated commons-apna-aap pypdf-annotations pypdf-attachment
      - name: Save PDF 2.0 copies and check them with qpdf
        run: dotnet run --file src/tools/CheckPdf20Copies.cs -- "${{ runner.temp }}/reference-pdfs" "${{ runner.temp }}/pdf20-copies"
      - name: Upload PDF 2.0 copies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf20-copies
          path: ${{ runner.temp }}/pdf20-copies
          if-no-files-found: warn
