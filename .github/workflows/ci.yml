name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
    with:
      srcFolder: '.'
      solutionFile: HyperPdf.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      dotnetVersions: |
        11.x
        10.x
  rendering-comparison:
    name: Standards and reference rendering
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf
        with:
          src-folder: '.'
          stamp-version: 'false'
          dotnet-versions: '11.x'
      - name: Install verified Firefox
        id: firefox
        run: dotnet run --file scripts/InstallComparisonFirefox.cs -- "${{ runner.temp }}/comparison-firefox"
      - name: Fetch verified comparison PDFs
        run: dotnet run --file scripts/FetchReferencePdfs.cs -- tests/reference-pdfs/manifest.json "${{ runner.temp }}/reference-pdfs" loc-marbury-v-madison irs-w9-2024 pyhanko-ua-and-a usgs-morrison-1957 usgs-lost-city-2023
      - name: Compare renderers against standards
        env:
          PVL_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
          PVL_REQUIRE_PDFJS: '1'
          IncludeReferencePdfRenderingTests: 'true'
          HYPERPDF_REFERENCE_PDF_DIR: ${{ runner.temp }}/reference-pdfs
          HYPERPDF_COMPARISON_OUTPUT: ${{ runner.temp }}/rendering-comparison
        run: dotnet run --project "${{ github.workspace }}/tests/HyperPdf.Engine.Tests/HyperPdf.Engine.Tests.csproj" -c Release -f net11.0 -- --treenode-filter '/*/*RenderingComparison/*/*' --report-trx --results-directory "${{ runner.temp }}/rendering-comparison"
      - name: Upload rendering comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rendering-comparison
          path: |
            ${{ runner.temp }}/rendering-comparison
            ${{ runner.temp }}/comparison-firefox/*.log
            ${{ runner.temp }}/comparison-firefox/source.txt
          if-no-files-found: warn
  pdfa-validation:
    name: PDF/A output validation (veraPDF)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf
        with:
          src-folder: '.'
          stamp-version: 'false'
          dotnet-versions: '11.x'
      - name: Setup Java for veraPDF
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install verified veraPDF
        id: verapdf
        run: dotnet run --file scripts/InstallVeraPdf.cs -- "${{ runner.temp }}/verapdf"
      - name: Fetch the PDF/A sample files
        run: dotnet run --file scripts/FetchReferencePdfs.cs -- tests/reference-pdfs/manifest.json "${{ runner.temp }}/pdfa-samples" verapdf-pdfa1a-unicode-cmap verapdf-pdfa1b-info-title verapdf-pdfa1b-linearize-settle verapdf-pdfa1b-deep-references verapdf-pdfa1b-utf32le-xmp verapdf-pdfa1b-utf32be-bom-xmp verapdf-pdfa2a-language verapdf-pdfa2b-signed verapdf-pdfa2b-extension-schemas verapdf-pdfa2u-tounicode verapdf-pdfa3b-embedded-file verapdf-pdfa4-signed verapdf-pdfa4-pieceinfo verapdf-pdfa4e-embedded-file verapdf-pdfa4f-embedded-file
      - name: Check out veraPDF's PDF/A test files
        id: testfiles
        run: dotnet run --file scripts/FetchVeraPdfTestFiles.cs -- "${{ runner.temp }}/verapdf-test-files"
      - name: Validate PDF/A output with veraPDF
        env:
          HYPERPDF_VERAPDF: ${{ steps.verapdf.outputs.verapdf-home }}
          HYPERPDF_REQUIRE_VERAPDF: '1'
          HYPERPDF_PDFA_SAMPLES: ${{ runner.temp }}/pdfa-samples
          HYPERPDF_VERAPDF_TEST_FILES: ${{ steps.testfiles.outputs.test-files-dir }}
          HYPERPDF_PDFA_OUTPUT: ${{ runner.temp }}/pdfa-output
        run: dotnet run --project "${{ github.workspace }}/tests/HyperPdfLibrary.Tests/HyperPdfLibrary.Tests.csproj" -c Release -f net11.0 -- --treenode-filter '/*/HyperPdfLibrary.Tests.Conformance.VeraPdf/*/*' --report-trx --results-directory "${{ runner.temp }}/pdfa-output"
      - name: Upload PDF/A outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdfa-validation
          path: ${{ runner.temp }}/pdfa-output
          if-no-files-found: warn
  pdf20-syntax:
    name: PDF 2.0 copy syntax check (qpdf)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@b824c637960b1886a6a30a2526856bbf017661cf
        with:
          src-folder: '.'
          stamp-version: 'false'
          dotnet-versions: '11.x'
      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
      - name: Fetch verified reference PDFs
        run: dotnet run --file scripts/FetchReferencePdfs.cs -- tests/reference-pdfs/manifest.json "${{ runner.temp }}/reference-pdfs" usgs-lost-city-2023 verapdf-ua-headings verapdf-ua-tables verapdf-ua-notes pdfjs-textfields pdfjs-js-buttons pdfjs-annotation-attachment pypdf-latex-forms pypdf-libreoffice-form pypdf-outline pypdf-arabic pypdf-annotations pypdf-attachment
      - name: Save PDF 2.0 copies and check them with qpdf
        run: dotnet run --file scripts/CheckPdf20Copies.cs -- "${{ runner.temp }}/reference-pdfs" "${{ runner.temp }}/pdf20-copies"
      - name: Upload PDF 2.0 copies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf20-copies
          path: ${{ runner.temp }}/pdf20-copies
          if-no-files-found: warn
